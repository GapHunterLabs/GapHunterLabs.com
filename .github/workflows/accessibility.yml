name: Accessibility (axe)

# Runs axe-core over the built static pages and fails on any WCAG 2.2 AA
# violation. GitHub Pages deploys from main, so this gate keeps the live site
# free of accessibility regressions.
#
# Engine (2026-11-03): a self-contained runner (a11y/run-axe.mjs) injects a
# current axe-core (4.14) into a current headless Chromium managed by
# puppeteer, and checks every funnel page in both the light and dark color
# schemes. It replaced `npx pa11y-ci@3`, which bundles axe-core 4.2 — an engine
# old enough to report color-contrast false positives on modern CSS (color-mix
# tints) that no current browser mis-renders. Using @axe-core/cli instead hit a
# ChromeDriver/Chrome version mismatch; a puppeteer-managed browser avoids a
# separate driver entirely. The checked URLs live in a11y/urls.json.

on:
  pull_request:
    paths:
      - "**.html"
      - "**.css"
      - "**.js"
      - "a11y/**"
      - ".github/workflows/accessibility.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)

      - name: Install gate dependencies (puppeteer + axe-core)
        working-directory: a11y
        run: npm ci

      - name: Serve the static site
        run: |
          python3 -m http.server 8080 --directory . &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/ > /dev/null

      # Since 2026-11-08: WCAG 2.2 AA, both themes set the way the site stores them, at 390 and 1280 px.
      - name: Run axe (WCAG 2.2 AA, light + dark, 390 and 1280 px)
        working-directory: a11y
        env:
          BASE_URL: http://localhost:8080
        run: node run-axe.mjs
