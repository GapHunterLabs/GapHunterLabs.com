name: Update catalog data

# Corre 2 veces por dia, hora America/Bogota (UTC-5, sin DST -- Colombia
# no observa horario de verano, asi que esta resta es fija todo el año):
#   12:00am (medianoche) Colombia = 05:00 UTC -> cron "0 5 * * *"
#   5:00pm Colombia      = 22:00 UTC          -> cron "0 22 * * *"
# Horarios reemplazados 2026-09-10 a pedido explicito del usuario (antes
# 1:00am/7:00pm Colombia, ver historial de commits para ese cron previo).
# Trae datos EN VIVO de JetBrains Marketplace + GitHub (descargas,
# pricing, reviews, rating, stars) para todos los plugins y actualiza
# el JSON publico, el SEO del catalogo y los conteos estaticos. Los campos que casi
# nunca cambian (pitch/why/niche/xmlId) viven congelados en
# pipeline/catalog_static_metadata.json, no se re-generan aca; ver el
# comentario "_comment" de ese archivo para como regenerarlo a mano si
# alguna vez hace falta.
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # permite disparar manualmente desde la pestaña Actions si hace falta

# Permiso minimo real que este job necesita, explicito a nivel top-level
# para que ningun job nuevo agregado despues herede accidentalmente algo
# mas amplio -- 'contents: write' es en si mismo el minimo indispensable
# (el ultimo paso hace push a este mismo repo), pero se declara aca en vez
# de dejarlo implicito (el default de un workflow sin este bloque es
# 'contents: write' + varios otros scopes de solo-lectura que este job
# nunca usa).
permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      # Pineadas por SHA de commit, no por tag mutable (v4/v5 son punteros
      # que el propio mantenedor de la action puede reapuntar a otro commit
      # sin que este workflow lo note) -- mismo principio de supply-chain
      # que gh actions-importer/step-security recomiendan. SHA real
      # confirmado contra el tag correspondiente el dia que se agrego este
      # pin; si algun dia hace falta actualizar la action, resolver el SHA
      # del nuevo tag primero, nunca pegar un SHA sin verificar de donde
      # salio.
      # 2026-11-09: v7.0.1 and v7.1.0 run on Node 24 (v4/v5 ran on Node 20, which GitHub deprecated). checkout v6+
      # keeps the token in a separate git config file, which `git push` in this same job still reads.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      # 2026-11-08: download counts are published exactly as the JetBrains
      # Marketplace reports them, and the stored history is moved to that
      # basis once (auto_update_catalog.py). These tests guard both rules;
      # a failure stops the run before any data is written or committed.
      # 2026-11-09: the same suite also covers the generation order, the services source and this workflow's wiring.
      - name: Unit tests of the build scripts (pipeline/tests)
        run: python -m unittest discover -s pipeline/tests -v

      # 2026-08-28: GH_TOKEN agregado -- bug real encontrado en auditoria
      # (hallazgo critico #25/#24 en la sesion que lo encontro): sin esta
      # env var, el `gh` CLI que pipeline/auto_update_catalog.py usa para
      # traer GitHub stars (github_stars(), ver ese archivo) queda SIN
      # AUTENTICAR -- toda llamada falla, github_stars() devuelve None
      # por su propio except, y el step de todos modos sale con exit 0
      # (el script solo imprime un [warn] a stderr por plugin, nunca
      # aborta) -- asi que el workflow se reportaba en VERDE mientras el
      # 100% de la recoleccion de stars fallaba en silencio, dejando
      # "GitHub Stars: 0" y "Avg Rating/Reviews" (que dependen del mismo
      # paso) permanentemente en cero en el sitio publicado. El token
      # automatico GITHUB_TOKEN (generado por GitHub en cada run, scope
      # ya cubierto por el bloque `permissions: contents: write` de
      # arriba) es suficiente -- no hace falta ningun secret nuevo, `gh`
      # lo reconoce automaticamente vía esta env var estandar.
      - name: Run auto-update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/auto_update_catalog.py

      # 2026-11-09: the VS Code data used to be refreshed by its own workflow (update-vscode-catalog.yml, retired),
      # which committed data/vscode-catalog-data.json without rebuilding any page: the catalog and the search index
      # lagged behind it until this workflow ran. Both now commit generated pages, and two writers of the same
      # one-line files (js/search-data.js) cannot be reconciled by the rebase below, so this is the only writer.
      # continue-on-error: a VS Code Marketplace outage must not stop the JetBrains update; the last step turns the
      # job red after publishing, so the failure is still seen.
      - name: Run VS Code auto-update
        id: vscode
        continue-on-error: true
        run: python pipeline/auto_update_vscode_catalog.py

      # 2026-11-09: every generated file (the catalog grid, the home blocks, one page per plugin, the feeds, the
      # Spanish pages, the search index and the ?v= asset hashes) is rebuilt by pipeline/regenerate.py, which owns
      # the order. The order used to be listed here step by step while a document and manual runs used shorter
      # ones; the Spanish Blog index, which build_writing_feed.py must fix after build_i18n.py, is one of the files
      # that went wrong that way. It runs after auto_update_catalog.py because every generator reads the data that
      # step just refreshed. Without --strict: a missing Spanish translation leaves that phrase in English and is
      # reported, without stopping the update. Pull requests run the same script with --check.
      - name: Rebuild every generated file (pipeline/regenerate.py)
        run: python pipeline/regenerate.py

      - name: Verify SEO guardrails (per-plugin pages, sitemap, hash shim)
        run: python _review/verify_seo.py

      # 2026-08-28 (auditoria, hallazgo cosmetico #56): red de seguridad
      # adicional antes de commitear -- DOCUMENTATION.md ya documenta 2
      # chequeos manuales ("the only real safety net") pero nunca
      # estaban automatizados en el unico proceso que modifica
      # Los tres consumidores deben conservar el mismo total antes de publicar.
      - name: Sanity-check generated catalog
        run: |
          python3 - <<'PYEOF'
          import json, re, sys
          with open("data/catalog-data.json", encoding="utf-8") as f:
              data = json.load(f)
          with open("catalog/index.html", encoding="utf-8") as f:
              catalog = f.read()
          m = re.search(r'<script type="application/ld\+json" id="catalog-jsonld">(.*?)</script>', catalog, re.S)
          if not m:
              sys.exit("catalog-jsonld script block not found")
          ld = json.loads(m.group(1))
          # Fase 2 (2026-09-22): ya no hay noscript de respaldo -- la
          # grilla real (pipeline/build_catalog_grid.py) ES el contenido
          # visible sin JS, asi que la paridad se mide contra ella, no
          # contra una lista aparte. Desde el sitio v2 (2026-09-28) la
          # tabla ya no va en el HTML: catalog.js la arma en el navegador
          # desde esas mismas tarjetas, asi que contar sus filas daba 0.
          totals = (data.get("totalPlugins"), len(data.get("plugins", [])),
                    ld.get("mainEntity", {}).get("numberOfItems"),
                    len(re.findall(r'class="plugin-card"', catalog)))
          if len(set(totals)) != 1:
              sys.exit("catalog count mismatch: data/rows/jsonld/cards=%r" % (totals,))
          print("catalog JSON/SEO parity OK (%s plugins)" % totals[0])
          PYEOF

      # 2026-09-11: bug real -- este workflow y update-vscode-catalog.yml
      # corren en el MISMO cron ("0 5 * * *" / "0 22 * * *"), asi que
      # cuando los dos tienen cambios reales el mismo dia, uno de los dos
      # push siempre puede llegar unos segundos despues de que el otro ya
      # actualizo `main` -- confirmado en vivo (run #47, commit 6402a083
      # de update-vscode-catalog.yml aterrizo en main a las 23:42:24Z,
      # este job intento pushear su propio commit a las 23:43:09Z y
      # `git push` fue rechazado con "! [rejected] main -> main (fetch
      # first)"). El job entero fallaba en rojo y el commit local del
      # runner se perdia (el runner se destruye al terminar) -- la
      # proxima corrida programada, 12h despues, s notaba pero perdia
      # esa actualizacion puntual. Fix: reintentar con fetch+rebase (los
      # archivos son 100% generados, no hay edicion manual con la que
      # pueda chocar un rebase real) antes de rendirse.
      - name: Commit and push if data changed
        run: |
          git config user.name "Gap Hunter Labs"
          git config user.email "gaphunterlabs@gmail.com"
          # catalog/*/index.html: las 146 (y contando) fichas por plugin de
          # la Fase 1 -- casi ninguna cambia en una corrida dada (el lastmod
          # solo se mueve con contenido sustancial, ver MATERIAL_FIELDS en
          # build_plugin_pages.py), pero hay que poder detectar y commitear
          # las que si cambiaron. css/plugin.css es el CSS compartido que
          # ese mismo script escribe; _review/plugin_lastmod.json es su
          # huella persistida entre corridas.
          # 2026-09-29: TODAS las paginas HTML, no una lista a mano.
          # version_assets.py reescribe el ?v= de cada pagina que use un
          # /css o /js que cambio; con la lista a mano, 9 paginas (security,
          # privacy, terms...) quedaban modificadas sin commitear en cada
          # corrida, y ese arbol sucio hacia fallar el rebase del reintento
          # ("cannot rebase: You have unstaged changes", run 36507499020).
          # 2026-11-09: js/contact.js and writing (the Blog feeds) can also be rebuilt by regenerate.py, and the VS
          # Code data is refreshed by this job too.
          TRACKED=(data/catalog-data.json data/vscode-catalog-data.json css/plugin.css js/slug-shim.js sitemap.xml
            _review/plugin_lastmod.json pipeline/catalog_daily_history.json
            pipeline/catalog_latest_data.json es feed.xml writing ':(glob)**/*.html'
            js/search-data.js js/site-search.js js/site-chrome.js js/contact.js)
          git add -A -- "${TRACKED[@]}"
          if git diff --cached --quiet; then
            echo "sin cambios reales en los datos, no se commitea nada"
            exit 0
          fi
          git commit -m "Auto-update catalog data ($(date -u +%Y-%m-%d))"
          # Guarda: un archivo que el pipeline modifica y TRACKED no cubre ya
          # no se pierde en silencio. Se lista como error, se aparta para que
          # el rebase pueda correr, se publica lo demas y el job termina en
          # rojo para que alguien agregue ese archivo a TRACKED.
          LEFTOVER=0
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::el pipeline dejo archivos modificados fuera de TRACKED (agregarlos a la lista):"
            git status --porcelain
            git stash push --include-untracked -m "fuera de TRACKED" >/dev/null
            LEFTOVER=1
          fi
          for i in 1 2 3 4 5; do
            if git push; then
              exit $LEFTOVER
            fi
            echo "push rechazado (main cambio durante la corrida, intento $i/5) -- fetch+rebase y reintentar"
            sleep $(( (RANDOM % 10) + 5 ))
            git fetch origin main
            git rebase origin/main
          done
          echo "push fallo tras 5 intentos -- abortando" >&2
          exit 1

      # The VS Code step may fail without stopping the JetBrains update (continue-on-error above); this turns the
      # run red once everything else is published, so the failure does not go unnoticed.
      - name: Fail if the VS Code update failed
        if: always() && steps.vscode.outcome == 'failure'
        run: |
          echo "::error::pipeline/auto_update_vscode_catalog.py failed: the VS Code data was not refreshed in this run"
          exit 1
